# Production values for Customs API
image:
  repository: smart-trade/customs-api
  tag: "v1.2.0"

replicaCount: 3

ingress:
  enabled: true
  host: "api.smart-trade.com"
  path: "/api/v1/CustomsCases"

env:
  ASPNETCORE_ENVIRONMENT: "Production"

secretEnv:
  - name: ConnectionStrings__DefaultConnection
    valueFrom:
      secretKeyRef:
        name: customs-api-secrets
        key: default-connection
