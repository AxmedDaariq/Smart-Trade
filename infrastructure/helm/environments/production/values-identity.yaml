# Production values for Identity API
image:
  repository: smart-trade/identity-api
  tag: "v1.1.0"

replicaCount: 2

ingress:
  enabled: true
  host: "api.smart-trade.com"
  path: "/api/v1/identity"

env:
  ASPNETCORE_ENVIRONMENT: "Production"
  Jwt__Issuer: "smart-trade.com"
  Jwt__Audience: "smart-trade-services"

# Provision this Kubernetes Secret out of band through Vault or the cluster secret manager.
secretEnv:
  - name: Jwt__Secret
    valueFrom:
      secretKeyRef:
        name: identity-api-secrets
        key: jwt-secret
  - name: ConnectionStrings__DefaultConnection
    valueFrom:
      secretKeyRef:
        name: identity-api-secrets
        key: default-connection
