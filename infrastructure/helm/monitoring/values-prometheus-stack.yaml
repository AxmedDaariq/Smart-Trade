# ─────────────────────────────────────────────────────────────────────────────
# kube-prometheus-stack values for Smart Trade Logistics Platform
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   --namespace monitoring --create-namespace \
#   --values infrastructure/helm/monitoring/values-prometheus-stack.yaml
# ─────────────────────────────────────────────────────────────────────────────

global:
  resolve_timeout: 5m
  evaluation_interval: 30s
  scrape_interval: 30s

# ─── Grafana ──────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  replicas: 2

  adminPassword: ""  # Set via Vault / External Secrets

  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: grafana-basic-auth
    hosts:
      - grafana.smart-trade.io
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.smart-trade.io

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource

  grafana.ini:
    server:
      domain: grafana.smart-trade.io
      root_url: "https://grafana.smart-trade.io"
    auth.generic_oauth:
      enabled: false   # Enable for SSO with your IdP
    analytics:
      reporting_enabled: false
    security:
      allow_embedding: false
      cookie_secure: true
      strict_transport_security: true
    log:
      level: warn

  # Pre-installed datasources
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
      jsonData:
        maxLines: 1000
    - name: Tempo
      type: tempo
      url: http://tempo.monitoring.svc.cluster.local:3100
      access: proxy
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
        serviceMap:
          datasourceUid: prometheus
        lokiSearch:
          datasourceUid: loki

# ─── Prometheus ───────────────────────────────────────────────────────────────
prometheus:
  enabled: true

  prometheusSpec:
    replicas: 2   # HA pair
    retention: 30d
    retentionSize: "50GiB"

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi

    # Only scrape ServiceMonitors with our label
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack

    podMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack

    # Remote write to long-term storage (e.g. Thanos / Cortex / Mimir)
    # remoteWrite:
    #   - url: https://mimir.smart-trade.io/api/v1/push

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2
        memory: 8Gi

    # Rule files for Smart Trade platform alerts
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack

# ─── Alertmanager ─────────────────────────────────────────────────────────────
alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 2
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          resources:
            requests:
              storage: 10Gi

  config:
    global:
      smtp_smarthost: "smtp.sendgrid.net:587"
      smtp_from: "alerts@smart-trade.io"
      slack_api_url_file: /etc/alertmanager/secrets/slack-webhook/url

    route:
      group_by: ["namespace", "alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "slack-critical"
      routes:
        - matchers:
            - severity = "critical"
          receiver: "pagerduty-critical"
          continue: true
        - matchers:
            - severity = "warning"
          receiver: "slack-warnings"
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"

    receivers:
      - name: "null"
      - name: "slack-critical"
        slack_configs:
          - channel: "#alerts-critical"
            title: "🔥 CRITICAL — {{ .GroupLabels.alertname }}"
            text: "{{ range .Alerts }}*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\n{{ end }}"
            send_resolved: true
      - name: "slack-warnings"
        slack_configs:
          - channel: "#alerts-warnings"
            title: "⚠️ WARNING — {{ .GroupLabels.alertname }}"
            send_resolved: true
      - name: "pagerduty-critical"
        pagerduty_configs:
          - service_key_file: /etc/alertmanager/secrets/pagerduty/key
            send_resolved: true

# ─── Node Exporter ────────────────────────────────────────────────────────────
nodeExporter:
  enabled: true

# ─── kube-state-metrics ───────────────────────────────────────────────────────
kubeStateMetrics:
  enabled: true

# ─── Prometheus Operator ──────────────────────────────────────────────────────
prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
