{{/*
PodDisruptionBudget — ensures minimum availability during node drains / upgrades
*/}}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "smart-trade-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smart-trade-service.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "smart-trade-service.selectorLabels" . | nindent 6 }}
{{- end }}
