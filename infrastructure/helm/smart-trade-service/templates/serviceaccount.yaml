{{/*
ServiceAccount with IRSA annotation for AWS SDK access
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smart-trade-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smart-trade-service.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.irsaRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.irsaRoleArn | quote }}
    eks.amazonaws.com/token-expiration: "86400"
  {{- end }}
automountServiceAccountToken: false
