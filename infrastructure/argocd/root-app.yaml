apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smart-trade-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: smart-trade-project
  source:
    repoURL: 'https://github.com/your-org/smart-trade-logistics-platform.git'
    path: infrastructure/argocd/apps
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
