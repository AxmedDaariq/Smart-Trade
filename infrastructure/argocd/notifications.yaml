apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.slack: |
    token: $slack-token
  template.app-deployed: |
    message: |
      :white_check_mark: Application {{.app.metadata.name}}
      has been successfully synced to {{.app.status.sync.revision}}.
      Health Status: {{.app.status.health.status}}
  template.app-health-degraded: |
    message: |
      :rotating_light: Application {{.app.metadata.name}} health is degraded!
      Reason: {{.app.status.operationState.message}}
  trigger.on-deployed: |
    - description: Application is synced and healthy
      send: [app-deployed]
      when: >-
        app.status.operationState != nil and
        app.status.operationState.phase in ['Succeeded'] and
        app.status.health.status == 'Healthy'
  trigger.on-health-degraded: |
    - description: Application health degraded
      send: [app-health-degraded]
      when: app.status.health.status == 'Degraded'
  subscriptions: |
    - recipients: [slack:deployments-alerts]
      triggers: [on-deployed, on-health-degraded]
