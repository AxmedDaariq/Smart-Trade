apiVersion: apps/v1
kind: Deployment
metadata:
  name: declaration-api
  namespace: smart-trade
spec:
  replicas: 3
  selector:
    matchLabels:
      app: declaration-api
  template:
    metadata:
      labels:
        app: declaration-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: declaration-api
          image: smart-trade/declaration-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: identity-api-secrets
                  key: jwt-secret
            - name: Jwt__Issuer
              value: "smart-trade.com"
            - name: Jwt__Audience
              value: "smart-trade-services"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: declaration-api-secrets
                  key: default-connection
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
