name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A08/A05: least-privilege token. No job in this workflow writes to the repository, so every job
# only ever receives read access to the checked out code.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore all projects
        run: |
          find . -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*' | \
          xargs -I {} dotnet restore {}

      - name: Build all projects
        run: |
          find . -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*' | \
          xargs -I {} dotnet build {} --no-restore --configuration Release


      # Runs every test project in the repo (services/**/X.Tests, tests/**, integration tests),
      # not just those under a literal "tests" directory. --configuration must match the Release
      # build above, otherwise --no-build finds no binaries.
      - name: Test all projects
        run: |
          find . -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*' \
          | grep -Ei 'Tests\.csproj$' \
          | xargs -I {} dotnet test {} --no-build --configuration Release \
            --verbosity normal --collect:"XPlat Code Coverage"

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/smart-trade-app:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/smart-trade-app:latest

  terraform-deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform init
        working-directory: ./infrastructure/terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./infrastructure/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  kubernetes-deploy:
    needs: terraform-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3.1
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f ./k8s/deployment.yaml
          kubectl apply -f ./infrastructure/monitoring/prometheus-grafana.yaml

  notify-slack:
    needs: [build-and-test, docker-build-push, terraform-deploy, kubernetes-deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2.4.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: '#deployments'
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "Deployment Status: ${{ job.status }}"
          SLACK_MESSAGE: "Smart Trade Platform CI/CD pipeline completed for branch ${{ github.ref }}"
          SLACK_USERNAME: "GitHub Actions Bot"
