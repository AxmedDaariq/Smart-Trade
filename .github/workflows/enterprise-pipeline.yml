name: Smart Trade Logistics Enterprise CI/CD

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]

jobs:
  # 1. Build and Static Analysis
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore smart-trade.sln

      - name: Build Application
        run: dotnet build smart-trade.sln --configuration Release

  # 2. Testing Pyramid (Unit -> Integration -> E2E)
  test-suite:
    needs: build-and-analyze
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_trade
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 22 (for Cypress)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/03-e2e/cypress/package-lock.json

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('tests/03-e2e/cypress/package-lock.json') }}
          restore-keys: cypress-${{ runner.os }}-

      - name: Run Unit Tests
        run: |
          for proj in tests/01-unit/*/*.csproj; do
            echo "::group::Testing $proj"
            dotnet test "$proj" --configuration Release
            echo "::endgroup::"
          done

      - name: Run Integration Tests (Testcontainers)
        run: |
          for proj in tests/02-integration/*/*.csproj; do
            if [[ "$proj" == *"Shared.IntegrationTests.csproj" ]]; then continue; fi
            echo "::group::Testing $proj"
            dotnet test "$proj" --configuration Release
            echo "::endgroup::"
          done

      - name: Run E2E Tests (Cypress)
        working-directory: tests/03-e2e/cypress
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: smart_trade
          MONGO_URL: mongodb://localhost:27017/smart_trade
          REDIS_URL: redis://localhost:6379
          RABBITMQ_API: http://localhost:15672/api
          RABBITMQ_USER: guest
          RABBITMQ_PASS: guest
          CYPRESS_VIDEO: "false"
        run: |
          npm ci --prefer-offline
          npx cypress verify
          npx cypress run \
            --browser electron \
            --headless \
            --config "video=false,watchForFileChanges=false" \
            --reporter cypress-mochawesome-reporter \
            --reporter-options "reportDir=cypress/reports,overwrite=false,html=true,json=true"

  # 3. Security & Performance Audit
  security-and-perf:
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP ZAP Security Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw owasp/zap2docker-stable zap-baseline.py \
          -t http://localhost:5000 -r zap_report.html

      - name: Run JMeter Performance Baseline
        run: |
          # This assumes jmeter is installed on the runner or uses a docker image
          docker run --rm -v $(pwd):/tests jmeter/jmeter \
            -n -t tests/04-performance/jmeter/scripts/load_test_platform.jmx -l results.jtl

  # 4. Infrastructure & Deployment (CD)
  deploy-staging:
    needs: security-and-perf
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to K8s Staging
        run: |
          echo "Applying Kubernetes Manifests..."
          # kubectl apply -f k8s/deployment.yaml
          # kubectl apply -f tests/06-infrastructure/k8s-validation/readiness_liveness.yaml

      - name: Post-Deploy Health Check
        run: |
          python3 tests/06-infrastructure/health-checks/global_health_check.py
