name: "IaC — Terraform Plan & Apply"

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, production]
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]

permissions:
  contents: read
  id-token: write        # OIDC for AWS
  pull-requests: write   # Post Terraform plan as PR comment

env:
  TF_VERSION: "1.9.0"
  AWS_REGION: "us-east-1"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Terraform Format Check
  # ─────────────────────────────────────────────────────────────────────────────
  terraform-fmt:
    name: "📐 Terraform Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive infrastructure/terraform/

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Terraform Plan (per environment)
  # ─────────────────────────────────────────────────────────────────────────────
  terraform-plan:
    name: "📋 Terraform Plan — ${{ matrix.environment }}"
    runs-on: ubuntu-latest
    needs: terraform-fmt
    strategy:
      matrix:
        include:
          - environment: dev
            role-arn: AWS_DEV_TERRAFORM_ROLE_ARN
          - environment: staging
            role-arn: AWS_STAGING_TERRAFORM_ROLE_ARN
          - environment: production
            role-arn: AWS_PROD_TERRAFORM_ROLE_ARN
      fail-fast: false
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[matrix.role-arn] }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: Terraform-${{ matrix.environment }}-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=smart-trade-tfstate-${{ matrix.environment }}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=smart-trade-tfstate-lock-${{ matrix.environment }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan-${{ matrix.environment }}.binary \
            -no-color \
            -detailed-exitcode 2>&1 | tee plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Convert plan to JSON for audit
        run: terraform show -json tfplan-${{ matrix.environment }}.binary > tfplan-${{ matrix.environment }}.json

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: |
            infrastructure/terraform/environments/${{ matrix.environment }}/tfplan-${{ matrix.environment }}.binary
            infrastructure/terraform/environments/${{ matrix.environment }}/tfplan-${{ matrix.environment }}.json
          retention-days: 7

      - name: Post plan to PR comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planPath = 'infrastructure/terraform/environments/${{ matrix.environment }}/plan-output.txt';
            const planOutput = fs.readFileSync(planPath, 'utf8');
            const maxLen = 60000;
            const truncated = planOutput.length > maxLen
              ? planOutput.substring(0, maxLen) + '\n\n... (truncated)'
              : planOutput;

            const body = `## Terraform Plan — \`${{ matrix.environment }}\`
            **Init:** \`${{ steps.init.outcome }}\`
            **Validate:** \`${{ steps.validate.outcome }}\`
            **Plan:** \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            *Triggered by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Terraform Apply (only on main push; production requires approval)
  # ─────────────────────────────────────────────────────────────────────────────
  terraform-apply-dev:
    name: "✅ Terraform Apply — dev"
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/dev
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/terraform/environments/dev

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=smart-trade-tfstate-dev" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=smart-trade-tfstate-lock-dev" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (from saved plan)
        run: terraform apply -auto-approve tfplan-dev.binary

  terraform-apply-staging:
    name: "✅ Terraform Apply — staging"
    runs-on: ubuntu-latest
    needs: terraform-apply-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/staging
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: infrastructure/terraform/environments/staging

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=smart-trade-tfstate-staging" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=smart-trade-tfstate-lock-staging" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (from saved plan)
        run: terraform apply -auto-approve tfplan-staging.binary

  terraform-apply-production:
    name: "✅ Terraform Apply — production (manual approval)"
    runs-on: ubuntu-latest
    needs: terraform-apply-staging
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production   # GitHub environment with required reviewers
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/production
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-production
          path: infrastructure/terraform/environments/production

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=smart-trade-tfstate-production" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=smart-trade-tfstate-lock-production" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (from saved plan)
        run: terraform apply -auto-approve tfplan-production.binary
