name: smart_trade_driver
description: "Smart Trade Logistics — driver mobile client (dark theme)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client with interceptors (auth header, correlation id, retry/backoff).
  dio: ^5.7.0
  # Persists cookies so the Identity API's HttpOnly `smarttrade_refresh`
  # cookie survives between requests (the refresh token is never readable
  # by Dart, by design).
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  # OS keychain / keystore for the access token.
  flutter_secure_storage: ^9.2.2
  # Correlation + idempotency ids.
  uuid: ^4.5.1
  # Lightweight value/state management for the auth + sync controllers.
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Lets the ApiClient tests assert on real request/response cycles without a
  # live backend or a socket.
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
