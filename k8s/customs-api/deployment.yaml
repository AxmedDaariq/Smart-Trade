apiVersion: apps/v1
kind: Deployment
metadata:
  name: customs-api-deployment
  namespace: default
  labels:
    app: customs-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customs-api
  template:
    metadata:
      labels:
        app: customs-api
    spec:
      containers:
        - name: customs-api
          image: smart-trade-customs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: customs-api-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: customs-api-secrets
                  key: default-connection
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
