apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-trade-app
  labels:
    app: smart-trade-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smart-trade-app
  template:
    metadata:
      labels:
        app: smart-trade-app
    spec:
      containers:
      - name: smart-trade-app
        image: yourdockerhubusername/smart-trade-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: smart-trade-app-service
spec:
  type: LoadBalancer
  selector:
    app: smart-trade-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
