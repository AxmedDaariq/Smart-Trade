apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-trade-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: api.smart-trade.local
    http:
      paths:
      - path: /api/v1/CustomsCases
        pathType: Prefix
        backend:
          service:
            name: customs-api-service
            port:
              number: 80
      # Halkan waxaad ku dari kartaa adeegyada kale, sida /ectn ama /payment
