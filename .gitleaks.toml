title = "SmartTrade Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Allowlist generated bundles, logs, test files, and mock tokens"

# Commits that were already remediated or contain false positives.
# See docs/security/secret-remediation.md for details.
commits = [
    # mobile/driver/test/core/networking/api_client_test.dart:4
    # The comment "bearer auth, idempotency/correlation ids" triggered
    # generic-api-key (false positive — no real secret present).
    "05aaeed3087308e30e78f98d2acd2e3b55fb91fb",
    # services/identity/Identity.Api/Program.cs:20 (historical commit)
    # A dev/test JWT fallback was introduced then removed in the next commit.
    # The current HEAD contains no hardcoded secret.
    "d261f261be8df8fd55f8eef3587d6014f19b26a7",
    # services/integration/Integration.Tests/Application/Commands/ProcessWebhookCommandHandlerTests.cs:12
    # Mock partner secret used strictly in unit tests ("test-secret-value-for-unit-testing-only")
    "202cb8a53229494add972572f07540b320b5e862",
]

paths = [
    '''(?i)repomix.*''',
    '''(?i).*\.log$''',
    '''(?i).*\.sarif$''',
    # .env.example / .env.test.example are templates, never real secrets
    '''(?i)\.env\..*''',
    # Top-level integration / e2e / perf / security test trees
    '''(?i)^tests/.*''',
    # Service unit and integration test trees
    '''(?i)^services/.*/.*Tests/.*''',
    # Mobile unit and widget test directories
    '''(?i)^mobile/.*/test/.*''',
    # EF Core migration snapshot files
    '''(?i).*Migrations/.*''',
]
